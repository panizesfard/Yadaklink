<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصولات | یدک لینک</title>
  <link rel="icon" href="logos/icon.png">
  <link rel="stylesheet" href="https://cdn.fontcdn.ir/Font/Persian/IRANSans/IRANSans.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="products">
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <nav class="site-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="logos/icon.png" alt="یدک لینک">
        <span class="nav-logo-text">یدک <span>لینک</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">خانه</a>
        <a href="products.html" class="nav-link active">محصولات</a>
        <a href="about.html" class="nav-link">درباره ما</a>
        <a href="blog.html" class="nav-link">مقالات</a>
        <a href="contact.html" class="nav-link">تماس</a>
      </div>
      <div class="nav-search-wrap">
        <svg class="nav-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="nav-search" placeholder="جستجو...">
        <div id="search-dropdown"></div>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle"><span class="theme-icon">☀️</span></button>
        <a href="cart.html" class="cart-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge">0</span>
        </a>
        <button id="menu-toggle" aria-label="منو" aria-expanded="false">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>
  </nav>

  <div id="mobile-menu">
    <a href="index.html">خانه</a>
    <a href="products.html">محصولات</a>
    <a href="about.html">درباره ما</a>
    <a href="blog.html">مقالات</a>
    <a href="contact.html">تماس با ما</a>
    <a href="cart.html">سبد خرید</a>
  </div>

  <div class="page-body">
    <div class="page-hero">
      <div class="container">
        <h1 class="page-hero-title">همه محصولات</h1>
        <p class="page-hero-sub">جستجو و فیلتر در میان قطعات یدکی اصل برای خودروهای ایرانی</p>
      </div>
    </div>

    <div class="container">
      <div class="products-page-layout">
        <!-- Sidebar -->
        <aside class="filter-sidebar">
          <div class="filter-sidebar-title">دسته‌بندی‌ها</div>
          <button class="sidebar-cat-btn active" data-cat-filter="all">همه محصولات</button>
          <button class="sidebar-cat-btn" data-cat-filter="brake">سیستم ترمز</button>
          <button class="sidebar-cat-btn" data-cat-filter="susp">سیستم تعلیق</button>
          <button class="sidebar-cat-btn" data-cat-filter="engine">قطعات موتوری</button>
          <button class="sidebar-cat-btn" data-cat-filter="cooling">سیستم خنک‌کننده</button>
          <button class="sidebar-cat-btn" data-cat-filter="electric">سیستم برق</button>
          <button class="sidebar-cat-btn" data-cat-filter="filter">فیلترها</button>
          <button class="sidebar-cat-btn" data-cat-filter="trans">انتقال قدرت</button>
        </aside>

        <!-- Products Main -->
        <div>
          <!-- Search Bar -->
          <form class="products-search-bar" id="filter-form">
            <input type="text" id="search-input" placeholder="نام قطعه یا کد فنی...">
            <input type="text" id="car-input" placeholder="مدل خودرو...">
            <select id="cat-select">
              <option value="all">همه دسته‌ها</option>
            </select>
            <button type="submit" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              جستجو
            </button>
          </form>

          <!-- Header Row -->
          <div class="products-main-header">
            <div class="results-info">
              <strong id="results-count">۰</strong> محصول یافت شد
            </div>
            <select class="sort-select" id="sort-select">
              <option value="default">پیش‌فرض</option>
              <option value="price-asc">ارزان‌ترین</option>
              <option value="price-desc">گران‌ترین</option>
              <option value="rating">بیشترین امتیاز</option>
            </select>
          </div>

          <!-- Grid -->
          <div class="products-grid" id="products-grid">
            <div class="empty-state">
              <p>در حال بارگذاری...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom" style="padding:24px 0">
          <div>© ۱۴۰۳ یدک لینک</div>
          <a href="index.html">بازگشت به خانه</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
