<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | یدک لینک</title>
  <link rel="icon" href="logos/icon.png">
  <link rel="stylesheet" href="https://cdn.fontcdn.ir/Font/Persian/IRANSans/IRANSans.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="cart">
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <nav class="site-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="logos/icon.png" alt="یدک لینک">
        <span class="nav-logo-text">یدک <span>لینک</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">خانه</a>
        <a href="products.html" class="nav-link">محصولات</a>
        <a href="about.html" class="nav-link">درباره ما</a>
        <a href="contact.html" class="nav-link">تماس</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle"><span class="theme-icon">☀️</span></button>
        <a href="cart.html" class="cart-btn" style="color:var(--accent)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge">0</span>
        </a>
        <button id="menu-toggle" aria-label="منو" aria-expanded="false">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>
  </nav>

  <div id="mobile-menu">
    <a href="index.html">خانه</a>
    <a href="products.html">محصولات</a>
    <a href="about.html">درباره ما</a>
    <a href="contact.html">تماس با ما</a>
  </div>

  <div class="page-body">
    <div class="page-hero">
      <div class="container">
        <h1 class="page-hero-title">سبد خرید</h1>
        <p class="page-hero-sub">قطعات انتخاب شده شما</p>
      </div>
    </div>

    <div class="container">
      <div class="cart-layout">
        <!-- Cart Items -->
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
            <h2 class="heading-3">کالاهای سبد خرید</h2>
            <button class="btn btn-ghost" id="clear-cart" style="font-size:0.82rem;color:var(--text3)">پاک کردن سبد</button>
          </div>
          <div id="cart-items"></div>
        </div>

        <!-- Summary -->
        <div class="cart-summary-box">
          <div class="cart-summary-title">خلاصه سفارش</div>
          <div id="cart-summary"></div>

          <div style="margin-top:20px;padding:16px;background:var(--bg3);border-radius:var(--r-md)">
            <div style="font-size:0.78rem;color:var(--text3);margin-bottom:8px">کد تخفیف دارید؟</div>
            <div style="display:flex;gap:8px">
              <input type="text" class="form-input" placeholder="کد تخفیف" style="flex:1;padding:8px 12px">
              <button class="btn btn-outline" style="padding:8px 16px;font-size:0.875rem"
                onclick="window.YL?.cart?.showToast('کد تخفیف نامعتبر است')">اعمال</button>
            </div>
          </div>

          <div style="margin-top:16px;padding:12px;background:var(--accent-subtle);border-radius:var(--r-md);font-size:0.8rem;color:var(--text2)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="display:inline;vertical-align:middle;margin-left:6px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            خرید شما با ضمانت اصالت کالا همراه است
          </div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom" style="padding:24px 0">
          <div>© ۱۴۰۳ یدک لینک</div>
          <a href="products.html">ادامه خرید</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
