<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود / ثبت‌نام | یدک لینک</title>
  <link rel="icon" href="logos/icon.png">
  <link rel="stylesheet" href="https://cdn.fontcdn.ir/Font/Persian/IRANSans/IRANSans.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="login">
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <nav class="site-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="logos/icon.png" alt="یدک لینک">
        <span class="nav-logo-text">یدک <span>لینک</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle"><span class="theme-icon">☀️</span></button>
        <a href="cart.html" class="cart-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="page-body">
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="logos/icon.png" alt="یدک لینک">
          <div class="auth-logo-name">یدک <span>لینک</span></div>
        </div>

        <div class="auth-tabs" id="auth-tabs">
          <button class="auth-tab active" data-auth="login" onclick="switchAuth('login')">ورود</button>
          <button class="auth-tab" data-auth="register" onclick="switchAuth('register')">ثبت‌نام</button>
        </div>

        <!-- Login Form -->
        <div id="login-form">
          <form class="auth-form" onsubmit="event.preventDefault(); window.YL?.cart?.showToast('ورود موفق — به یدک لینک خوش آمدید'); setTimeout(()=>location.href='index.html', 1500)">
            <div class="form-group">
              <label class="form-label">شماره موبایل</label>
              <input type="tel" class="form-input" placeholder="۰۹۱۲۰۰۰۰۰۰۰" required>
            </div>
            <div class="form-group">
              <label class="form-label">رمز عبور</label>
              <input type="password" class="form-input" placeholder="رمز عبور" required>
            </div>
            <div style="display:flex;justify-content:flex-end">
              <a href="#" style="font-size:0.82rem;color:var(--accent)">فراموشی رمز عبور</a>
            </div>
            <button type="submit" class="btn btn-primary btn-full">ورود به حساب</button>
            <div class="auth-divider">یا</div>
            <button type="button" class="btn btn-outline btn-full" onclick="window.YL?.cart?.showToast('ورود با OTP — در نسخه واقعی فعال می‌شود')">
              ارسال کد تأیید
            </button>
          </form>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="hidden">
          <form class="auth-form" onsubmit="event.preventDefault(); window.YL?.cart?.showToast('ثبت‌نام موفق — خوش آمدید!')">
            <div class="form-group">
              <label class="form-label">نام و نام خانوادگی *</label>
              <input type="text" class="form-input" placeholder="نام شما" required>
            </div>
            <div class="form-group">
              <label class="form-label">شماره موبایل *</label>
              <input type="tel" class="form-input" placeholder="۰۹۱۲۰۰۰۰۰۰۰" required>
            </div>
            <div class="form-group">
              <label class="form-label">رمز عبور *</label>
              <input type="password" class="form-input" placeholder="حداقل ۸ کاراکتر" required>
            </div>
            <div class="form-group">
              <label class="form-label">تکرار رمز عبور *</label>
              <input type="password" class="form-input" placeholder="تکرار رمز عبور" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">ایجاد حساب کاربری</button>
          </form>
        </div>

        <div style="text-align:center;margin-top:20px;font-size:0.82rem;color:var(--text3)">
          با ورود یا ثبت‌نام، <a href="#" style="color:var(--accent)">قوانین و مقررات</a> یدک لینک را می‌پذیرید.
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchAuth(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.auth === tab));
      document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
    }
  </script>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
